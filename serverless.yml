#file: noinspection YAMLSchemaValidation
org: brandonbr1208
app: my-app
service: users-api-java

provider:
  name: aws
  runtime: java21
  stage: dev
  region: us-east-1
  memorySize: 512
  timeout: 15
  deploymentMethod: direct
  environment:
    TABLE_NAME: users
    QUEUE_URL: https://sqs.us-east-1.amazonaws.com/121604171970/cola-pragma
    TOPIC_ARN: arn:aws:sns:us-east-1:121604171970:user-events-topic

package:
  artifact: build/libs/users-api-java-1.4.0.jar

functions:
  getUsers:
    handler: com.pragma.handler.HandlerGet
    events:
      - httpApi:
          path: /user/list
          method: GET
    iam:
      role:
        statements:
          - Effect: Allow
            Action:
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:GetItem
            Resource: arn:aws:dynamodb:us-east-1:*:table/users

  createUser:
    handler: com.pragma.handler.HandlerCreate
    events:
      - httpApi:
          path: /user/create
          method: POST
    iam:
      role:
        statements:
          # Permisos para DynamoDB (Escritura de usuarios)
          - Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:UpdateItem
            Resource: arn:aws:dynamodb:us-east-1:*:table/users
          # Únicamente puede enviar mensajes a SQS
          - Effect: Allow
            Action:
              - sqs:SendMessage
            Resource: arn:aws:sqs:us-east-1:121604171970:cola-pragma

  updateUser:
    handler: com.pragma.handler.HandlerUpdate
    events:
      - httpApi:
          path: /user/{id}
          method: PUT
    iam:
      role:
        statements:
          - Effect: Allow
            Action:
              - dynamodb:UpdateItem
              - dynamodb:GetItem
            Resource: arn:aws:dynamodb:us-east-1:*:table/users

  deleteUser:
    handler: com.pragma.handler.HandlerDelete
    events:
      - httpApi:
          path: /user/{id}
          method: DELETE
    iam:
      role:
        statements:
          - Effect: Allow
            Action:
              - dynamodb:DeleteItem
              - dynamodb:GetItem
            Resource: arn:aws:dynamodb:us-east-1:*:table/users

  sendEmail:
    handler: com.pragma.handler.HandlerSendEmail
    events:
      - sqs:
          arn: arn:aws:sqs:us-east-1:121604171970:cola-pragma
          batchSize: 1
    iam:
      role:
        statements:
          # Únicamente puede leer y eliminar mensajes de la cola SQS
          - Effect: Allow
            Action:
              - sqs:ReceiveMessage
              - sqs:DeleteMessage
              - sqs:GetQueueAttributes
            Resource: arn:aws:sqs:us-east-1:121604171970:cola-pragma
          # Únicamente puede publicar en SNS
          - Effect: Allow
            Action:
              - sns:Publish
            Resource: arn:aws:sns:us-east-1:121604171970:user-events-topic