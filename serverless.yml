#file: noinspection YAMLSchemaValidation
org: brandonbr1208
app: my-app
service: users-api-java

provider:
  name: aws
  runtime: java21
  stage: dev
  region: us-east-1
  memorySize: 512
  timeout: 15
  deploymentMethod: direct
  environment:
    TABLE_NAME: users
    QUEUE_URL:
      Ref: PragmaQueue
    TOPIC_ARN:
      Ref: UserEventsTopic

package:
  artifact: build/libs/users-api-java-1.5.0.jar

functions:
  getUsers:
    handler: com.pragma.handler.HandlerGet
    events:
      - httpApi:
          path: /user/list
          method: GET
    iam:
      role:
        statements:
          - Effect: Allow
            Action:
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:GetItem
            Resource:
              - !GetAtt UsersTable.Arn

  createUser:
    handler: com.pragma.handler.HandlerCreate
    events:
      - httpApi:
          path: /user/create
          method: POST
    iam:
      role:
        statements:
          - Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:UpdateItem
            Resource:
              - !GetAtt UsersTable.Arn
          - Effect: Allow
            Action:
              - sqs:SendMessage
            Resource:
              - !GetAtt PragmaQueue.Arn

  updateUser:
    handler: com.pragma.handler.HandlerUpdate
    events:
      - httpApi:
          path: /user/{id}
          method: PUT
    iam:
      role:
        statements:
          - Effect: Allow
            Action:
              - dynamodb:UpdateItem
              - dynamodb:GetItem
            Resource:
              - !GetAtt UsersTable.Arn

  deleteUser:
    handler: com.pragma.handler.HandlerDelete
    events:
      - httpApi:
          path: /user/{id}
          method: DELETE
    iam:
      role:
        statements:
          - Effect: Allow
            Action:
              - dynamodb:DeleteItem
              - dynamodb:GetItem
            Resource:
              - !GetAtt UsersTable.Arn

  sendEmail:
    handler: com.pragma.handler.HandlerSendEmail
    events:
      - sqs:
          arn: !GetAtt PragmaQueue.Arn
          batchSize: 1
    iam:
      role:
        statements:
          - Effect: Allow
            Action:
              - sns:Publish
            Resource:
              - !Ref UserEventsTopic

resources:
  Resources:
    # 1. Tabla DynamoDB
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: users
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH

    # 2. Cola SQS con su política de acceso exacta
    PragmaQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: cola-pragma

    PragmaQueuePolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - !Ref PragmaQueue
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Sid: AllowCrearUsuarioLambdaToSendMessages
              Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sqs:SendMessage
              Resource: !GetAtt PragmaQueue.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${self:provider.stage}-createUser
            - Sid: AllowEnviarCorreoLambdaToConsumeMessages
              Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action:
                - sqs:ReceiveMessage
                - sqs:DeleteMessage
                - sqs:GetQueueAttributes
              Resource: !GetAtt PragmaQueue.Arn
              Condition:
                ArnEquals:
                  aws:SourceArn: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${self:provider.stage}-sendEmail

    # 3. Tópico SNS, su política de acceso y suscripción de correo
    UserEventsTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: user-events-topic
        Subscription:
          - Protocol: email
            Endpoint: brandonbr1208@gmail.com

    UserEventsTopicPolicy:
      Type: AWS::SNS::TopicPolicy
      Properties:
        Topics:
          - !Ref UserEventsTopic
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Sid: AllowSendEmailLambdaToPublishToSNS
              Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: SNS:Publish
              Resource: !Ref UserEventsTopic
              Condition:
                ArnEquals:
                  aws:SourceArn: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${self:provider.stage}-sendEmail