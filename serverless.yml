#file: noinspection YAMLSchemaValidation
org: brandonbr1208
app: my-app
service: users-api-java

provider:
  name: aws
  runtime: java21
  stage: dev
  region: us-east-1
  memorySize: 512
  timeout: 15
  deploymentMethod: direct
  environment:
    TABLE_NAME: users

package:
  artifact: build/libs/users-api-java-1.2.0.jar

functions:
  getUsers:
    handler: com.pragma.handler.HandlerGet
    events:
      - httpApi:
          path: /user/list
          method: GET
    iam:
      role:
        statements:
          - Effect: Allow
            Action:
              - dynamodb:Query
              - dynamodb:Scan
              - dynamodb:GetItem
            Resource:
              - !GetAtt UsersTable.Arn

  createUser:
    handler: com.pragma.handler.HandlerCreate
    events:
      - httpApi:
          path: /user/create
          method: POST
    iam:
      role:
        statements:
          - Effect: Allow
            Action:
              - dynamodb:PutItem
              - dynamodb:UpdateItem
            Resource:
              - !GetAtt UsersTable.Arn

  updateUser:
    handler: com.pragma.handler.HandlerUpdate
    events:
      - httpApi:
          path: /user/{id}
          method: PUT
    iam:
      role:
        statements:
          - Effect: Allow
            Action:
              - dynamodb:UpdateItem
              - dynamodb:GetItem
            Resource:
              - !GetAtt UsersTable.Arn

  deleteUser:
    handler: com.pragma.handler.HandlerDelete
    events:
      - httpApi:
          path: /user/{id}
          method: DELETE
    iam:
      role:
        statements:
          - Effect: Allow
            Action:
              - dynamodb:DeleteItem
              - dynamodb:GetItem
            Resource:
              - !GetAtt UsersTable.Arn

resources:
  Resources:
    # 1. Tabla DynamoDB
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: users
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH